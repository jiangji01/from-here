name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check bridge/server.js
          node --check bridge/now-playing-jxa.js
          node --check bridge/providers/index.js
          bash -n Install.command setup.command start.command configure-ai.command diagnose.command scripts/install-core.sh scripts/build-release.sh scripts/test-release.sh
      - name: Offline mock and provider tests
        working-directory: bridge
        run: npm test
      - name: Build and validate macOS runtime release
        run: |
          ./scripts/build-release.sh dist
          ./scripts/test-release.sh dist

  build-arm64-user-test:
    if: github.ref == 'refs/heads/tmp/v1.1.1-test-package'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Run deterministic tests
        working-directory: bridge
        run: npm test
      - name: Prepare bundled arm64 runtime
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION=22.22.0
          STAGE="$PWD/.runtime-arm64"
          mkdir -p "$STAGE/node" "$STAGE/ncm" "$STAGE/downloads" "$STAGE/extract"
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz" -o "$STAGE/downloads/node.tar.gz"
          echo "5ed4db0fcf1eaf84d91ad12462631d73bf4576c1377e192d222e48026a902640  $STAGE/downloads/node.tar.gz" | shasum -a 256 -c -
          tar -xzf "$STAGE/downloads/node.tar.gz" -C "$STAGE/extract" --strip-components=1
          mkdir -p "$STAGE/node/bin"
          cp "$STAGE/extract/bin/node" "$STAGE/node/bin/node"
          cp "$STAGE/extract/LICENSE" "$STAGE/node/LICENSE"
          chmod +x "$STAGE/node/bin/node"
          npm install --prefix "$STAGE/ncm" --omit=dev --ignore-scripts "@music163/ncm-cli@0.1.7"
          test -x "$STAGE/ncm/node_modules/.bin/ncm-cli"
          "$STAGE/ncm/node_modules/.bin/ncm-cli" --version
      - name: Build exact user test package
        shell: bash
        run: |
          set -euo pipefail
          export FROM_HERE_BUNDLED_NODE_ARM64_DIR="$PWD/.runtime-arm64/node"
          export FROM_HERE_BUNDLED_NCM_ARM64_DIR="$PWD/.runtime-arm64/ncm"
          export FROM_HERE_RELEASE_SUFFIX="v1.1.1-test-arm64"
          ./scripts/build-release.sh dist
          ./scripts/test-release.sh dist
          ZIP=$(find dist -maxdepth 1 -name 'From-Here-v*-macOS-v1.1.1-test-arm64.zip' | head -1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d unpacked
          APP=$(find unpacked -maxdepth 1 -type d -name 'From-Here-v*-macOS-v1.1.1-test-arm64' | head -1)
          source "$APP/.from-here/scripts/runtime-env.sh"
          test "${FROM_HERE_BUNDLED_RUNTIME:-}" = "1"
          test "$(uname -m)" = "arm64"
          ncm-cli --version
          PORT=19431 MOCK_NCM=1 node "$APP/.from-here/bridge/server.js" > bridge.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:19431/api/health >/dev/null; then break; fi
            sleep .25
          done
          curl -fsS http://127.0.0.1:19431/api/health >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: from-here-v1.1.1-test-arm64
          path: dist/From-Here-v*-macOS-v1.1.1-test-arm64.zip
          if-no-files-found: error
