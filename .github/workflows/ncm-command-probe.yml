name: Probe ncm-cli Commands
on:
  push:
    branches: ['fix/v1.1.1-listening-continuity']
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Probe dynamic command sync
        shell: bash
        run: |
          set -u
          npm install --prefix "$RUNNER_TEMP/ncm" --omit=dev --ignore-scripts '@music163/ncm-cli@0.1.7'
          export PATH="$RUNNER_TEMP/ncm/node_modules/.bin:$PATH"
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          ncm-cli config set appId 123456 >/dev/null 2>&1 || true
          ncm-cli config set privateKey dummy_private_key >/dev/null 2>&1 || true
          echo '=== BEFORE COMMANDS ==='
          ncm-cli --help || true
          echo '=== COMMANDS OUTPUT ==='
          ncm-cli commands || true
          echo '=== FILES AFTER COMMANDS ==='
          find "$HOME/.config/ncm-cli" -maxdepth 3 -type f -print | sort || true
          echo '=== AFTER COMMANDS HELP ==='
          ncm-cli --help || true
          echo '=== AFTER COMMANDS DIRECT SEARCH ==='
          ncm-cli search song --keyword 'Linkin Park In the End' --userInput probe || true
          echo '=== AFTER COMMANDS DIRECT USER ==='
          ncm-cli user favorite --userInput probe || true
          echo '=== APP LOG ==='
          tail -120 "$HOME/.config/ncm-cli/app.log" 2>/dev/null || true
